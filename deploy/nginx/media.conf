# Nginx config for photos stored on the server's own disk instead of Cloudinary.
#
# Both blocks below belong in the backend's server {} block on the VPS; reload nginx
# afterwards. Adjust /srv/lidmanovi/backend to wherever the repo is checked out.


# --- Accepting uploads -------------------------------------------------------------
#
# Nginx defaults client_max_body_size to 1m, which rejects a single phone photo with
# "413 Request Entity Too Large" before the request ever reaches Django. Django allows
# up to DATA_UPLOAD_MAX_NUMBER_FILES=60 files per request, so size this for a whole
# batch of large originals, not for one file.
#
# Put this at the server {} level (not inside a location) so it also covers /admin/.
client_max_body_size 200m;

# Large bodies are streamed to a temp file anyway; buffering them in nginx first only
# adds latency before gunicorn (which has --timeout 300) starts reading.
proxy_request_buffering off;
client_body_timeout 300s;


# --- Serving uploads ---------------------------------------------------------------
#
# Django only serves MEDIA_URL when DEBUG is on (settings/urls.py), so in production the
# reverse proxy has to do it. The path below is the host-side MEDIA_ROOT:
# docker-compose.yml bind-mounts the whole project as `.:/app`, so the container's
# /app/media is <repo-on-host>/media — nginx reads the same files the container writes.

location /media/ {
    alias /srv/lidmanovi/backend/media/;

    # Uploads are immutable: the filename contains a uuid4 (see photo_upload_to), so a
    # changed photo is always a new URL and can be cached indefinitely.
    expires 30d;
    add_header Cache-Control "public, immutable";

    # Never let a crafted upload name be interpreted as a script.
    autoindex off;
    add_header X-Content-Type-Options "nosniff";

    access_log off;
    try_files $uri =404;
}