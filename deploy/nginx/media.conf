# Serving uploaded photos from the server's disk instead of Cloudinary.
#
# Django only serves MEDIA_URL when DEBUG is on (settings/urls.py), so in production the
# reverse proxy has to do it. Drop this location block into the backend's server {} block
# on the VPS and reload nginx.
#
# The path below is the host-side MEDIA_ROOT. docker-compose.yml bind-mounts the whole
# project as `.:/app`, so the container's /app/media is <repo-on-host>/media — nginx reads
# the same files the container writes, no extra volume needed.
#
# Adjust /srv/lidmanovi/backend to wherever the repo is checked out on the VPS.

location /media/ {
    alias /srv/lidmanovi/backend/media/;

    # Uploads are immutable: the filename contains a uuid4 (see photo_upload_to), so a
    # changed photo is always a new URL and can be cached indefinitely.
    expires 30d;
    add_header Cache-Control "public, immutable";

    # Never let a crafted upload name be interpreted as a script.
    autoindex off;
    add_header X-Content-Type-Options "nosniff";

    access_log off;
    try_files $uri =404;
}