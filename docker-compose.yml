services:
  backend:
    restart: always
    build:
      context: .
      dockerfile: Dockerfile
    container_name: backend
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      - db
    environment:
      EMAIL_HOST_USER: ${EMAIL_HOST_USER}
      EMAIL_HOST_PASSWORD: ${EMAIL_HOST_PASSWORD}
      DEFAULT_FROM_EMAIL: ${DEFAULT_FROM_EMAIL}
      INIT_IMPORT_FRONTEND_TRANSLATIONS: ${INIT_IMPORT_FRONTEND_TRANSLATIONS:-1}
      FRONTEND_LOCALES_DIR: ${FRONTEND_LOCALES_DIR:-/app/tmp/locales}
      FRONTEND_SOURCE_LANG: ${FRONTEND_SOURCE_LANG:-cs}
      INIT_IMPORT_OVERWRITE: ${INIT_IMPORT_OVERWRITE:-1}
      INIT_IMPORT_ONLY_IF_EMPTY: ${INIT_IMPORT_ONLY_IF_EMPTY:-1}
      INIT_SYNC_PHOTOS_FROM_MEDIA: ${INIT_SYNC_PHOTOS_FROM_MEDIA:-1}
      INIT_SYNC_PHOTOS_ONLY_IF_EMPTY: ${INIT_SYNC_PHOTOS_ONLY_IF_EMPTY:-1}
      MEDIA_PHOTOS_DIR: ${MEDIA_PHOTOS_DIR:-/app/media/galerie}
      DEBUG: ${DEBUG:-False}

  db:
    restart: always
    image: postgres:16
    container_name: postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    # Not published to the host on purpose: the backend reaches this container over the
    # internal Docker network by service name ("db"). For a local DB client, use
    # `docker compose exec db psql ...` or a temporary port-forward instead of exposing 5432.

volumes:
  postgres_data:

networks:
  default:
    name: bajerlukascz_network
    external: true
