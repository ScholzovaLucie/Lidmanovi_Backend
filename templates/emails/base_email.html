<!DOCTYPE html>
<html lang="cs" xmlns:v="urn:schemas-microsoft-com:vml">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="light only">
  <meta name="supported-color-schemes" content="light only">
  <style>
    :root { color-scheme: light only; }
    body { margin: 0; padding: 0; background-color: #f4efe6 !important; font-family: Georgia, 'Times New Roman', serif; }
    @media (prefers-color-scheme: dark) {
      body { background-color: #f4efe6 !important; }
      .email-outer { background-color: #f4efe6 !important; }
      .email-card { background-color: #ffffff !important; }
      .email-header { background-color: #ffffff !important; }
      .email-body { background-color: #ffffff !important; color: #1e3a52 !important; }
      .email-footer { background-color: #292520 !important; }
      .detail-box { background-color: #f4efe6 !important; }
      p, li, span, td { color: inherit !important; }
    }
  </style>
</head>
<body style="margin:0;padding:0;background-color:#f5f5f3;" bgcolor="#f5f5f3">

  <table class="email-outer" width="100%" cellpadding="0" cellspacing="0" border="0"
         style="background-color:#f4efe6;padding:40px 20px;" bgcolor="#f4efe6">
    <tr>
      <td align="center">

        <!-- Card -->
        <table class="email-card" width="100%" cellpadding="0" cellspacing="0" border="0"
               style="max-width:600px;background-color:#ffffff;border:1px solid #dce3ea;border-radius:3px;" bgcolor="#ffffff">

          <!-- Header -->
          <tr>
            <td class="email-header" align="center"
                style="padding:32px 40px 28px;border-bottom:2px solid #2d4a60;background-color:#ffffff;" bgcolor="#ffffff">
              <img src="https://ulidmanu.cz/galerie/logolidman.webp"
                   alt="u Lidmanů – Pension & Restaurace"
                   width="200"
                   style="display:block;margin:0 auto;">
            </td>
          </tr>

          <!-- Ornament -->
          <tr>
            <td align="center" style="padding:18px 40px 4px;background-color:#ffffff;" bgcolor="#ffffff">
              <span style="color:#2d4a60;font-size:15px;letter-spacing:10px;">&#8212; &#10022; &#8212;</span>
            </td>
          </tr>

          <!-- Body -->
          <tr>
            <td class="email-body" style="padding:8px 48px 36px;background-color:#ffffff;color:#1e3a52;" bgcolor="#ffffff">
              {% block content %}{% endblock %}
            </td>
          </tr>

          <!-- Divider -->
          <tr>
            <td style="padding:0 48px;background-color:#ffffff;" bgcolor="#ffffff">
              <hr style="border:none;border-top:1px solid #dce3ea;margin:0;">
            </td>
          </tr>

          <!-- Footer -->
          <tr>
            <td class="email-footer" align="center"
                style="padding:24px 48px 28px;background-color:#292520;" bgcolor="#292520">
              <p style="margin:0 0 6px;font-family:Georgia,serif;color:#f4efe6;font-size:13px;letter-spacing:2px;text-transform:uppercase;">Pension &amp; Restaurace u Lidmanů</p>
              <p style="margin:0;font-family:Arial,Helvetica,sans-serif;color:#a89880;font-size:12px;">
                Machov 154, 549 63 Machov &nbsp;|&nbsp; <a href="mailto:info@lidmanovi.cz" style="color:#c8b89a;text-decoration:none;">info@lidmanovi.cz</a>
              </p>
            </td>
          </tr>

        </table>
        <!-- End card -->

      </td>
    </tr>
  </table>

</body>
</html>
